<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NIMBUS VST UI Mockup</title>
  <style>
    :root {
      --bg: #18181c;
      --header: #111111;
      --panel: #1e1e23;
      --line: #3c3c41;
      --line-soft: #2a2a2f;
      --text: #f4f2ea;
      --muted: #aaa59a;
      --accent: #ddbf72;
      --accent-dim: rgba(221, 191, 114, 0.22);
      --control: #151519;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0e0e11;
      color: var(--text);
      font-family: Inter, "Segoe UI", Arial, sans-serif;
    }

    .plugin {
      width: 720px;
      height: 560px;
      overflow: hidden;
      background:
        radial-gradient(circle at 20% 0%, rgba(221, 191, 114, 0.055), transparent 30%),
        linear-gradient(180deg, #1a1a1f 0%, var(--bg) 100%);
      border: 1px solid #2b2b31;
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.5);
    }

    header {
      height: 48px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 20px;
      background: var(--header);
      border-bottom: 1px solid var(--line-soft);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 260px;
      height: 100%;
    }

    .logo {
      width: 30px;
      height: 30px;
      border-radius: 5px;
      background: #111;
      object-fit: cover;
      box-shadow: 0 0 0 1px rgba(221, 191, 114, 0.18), 0 0 18px rgba(221, 191, 114, 0.08);
    }

    .brand-title {
      font-size: 20px;
      line-height: 1;
      font-weight: 740;
      letter-spacing: 0.08em;
    }

    .brand-subtitle {
      margin-left: 1px;
      margin-top: 4px;
      color: var(--muted);
      font-size: 9px;
      font-weight: 650;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .header-spacer {
      flex: 1;
    }

    .select,
    .button,
    .toggle,
    .small-select {
      height: 24px;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: var(--control);
      color: var(--text);
      font-size: 12px;
      font-weight: 560;
    }

    .select {
      width: 200px;
      justify-content: start;
      padding: 0 24px 0 10px;
      position: relative;
    }

    .select::after,
    .small-select::after {
      content: "";
      width: 7px;
      height: 7px;
      border-right: 2px solid var(--accent);
      border-bottom: 2px solid var(--accent);
      transform: rotate(45deg);
      position: absolute;
      right: 10px;
      top: 6px;
    }

    .button {
      width: 60px;
      height: 22px;
    }

    main {
      height: 442px;
      padding: 0 10px 10px;
    }

    .macro-row {
      height: 120px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      border-bottom: 1px solid rgba(60, 60, 65, 0.35);
    }

    .macro {
      position: relative;
      display: grid;
      place-items: center;
      padding-top: 7px;
    }

    .macro + .macro {
      border-left: 1px solid rgba(60, 60, 65, 0.28);
    }

    .control-stack {
      width: 96px;
      height: 98px;
      display: grid;
      grid-template-rows: 20px 76px;
      justify-items: center;
    }

    .label {
      color: var(--text);
      font-size: 12px;
      line-height: 16px;
      text-align: center;
      white-space: nowrap;
    }

    .knob {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      position: relative;
      background:
        radial-gradient(circle at 34% 28%, #35353b 0 18%, #27272d 52%, #17171b 76%),
        conic-gradient(from 220deg, var(--accent) 0deg 220deg, var(--line) 220deg 310deg, transparent 310deg);
      box-shadow: inset 0 0 0 8px var(--bg), inset 0 0 0 12px #27272c;
    }

    .knob.small {
      width: 36px;
      height: 36px;
      box-shadow: inset 0 0 0 5px var(--bg), inset 0 0 0 8px #27272c;
    }

    .knob::after {
      content: "";
      position: absolute;
      width: 4px;
      height: 22px;
      left: calc(50% - 2px);
      top: 8px;
      border-radius: 3px;
      background: var(--text);
      transform: rotate(38deg);
      transform-origin: 50% 27px;
    }

    .knob.small::after {
      width: 3px;
      height: 12px;
      top: 5px;
      transform-origin: 50% 13px;
    }

    .sync {
      position: absolute;
      bottom: 6px;
      width: 50px;
      height: 18px;
      font-size: 11px;
    }

    .content {
      height: 302px;
      display: grid;
      grid-template-columns: 32fr 10px 68fr;
      padding-top: 10px;
    }

    .card {
      border: 1px solid var(--line);
      border-radius: 4px;
      position: relative;
      padding-top: 25px;
    }

    .card-title,
    .subgroup-title {
      position: absolute;
      top: 4px;
      left: 0;
      right: 0;
      text-align: center;
      color: var(--text);
      font-size: 12px;
      text-transform: lowercase;
    }

    .left-card {
      display: grid;
      grid-template-rows: 1fr 1fr 1fr 80px;
      gap: 0;
      padding: 24px 5px 5px;
    }

    .mini-row,
    .right-card-row {
      display: grid;
      place-items: center;
    }

    .mini-control {
      width: 100px;
      display: grid;
      grid-template-rows: 16px 50px;
      justify-items: center;
      align-items: center;
    }

    .subgroup {
      position: relative;
      width: 100%;
      border: 1px solid var(--accent);
      border-radius: 4px;
      display: grid;
      grid-template-rows: 16px 1fr 1fr;
      padding: 18px 5px 5px;
    }

    .subgroup-title {
      top: 2px;
      color: var(--accent);
      font-size: 11px;
      text-transform: uppercase;
    }

    .right-column {
      display: grid;
      grid-template-rows: 1fr 10px 1fr 10px 1fr;
    }

    .right-card {
      display: grid;
      padding: 24px 5px 5px;
    }

    .tone {
      grid-template-columns: repeat(3, 1fr);
    }

    .mod,
    .shimmer {
      grid-template-columns: repeat(2, 1fr);
    }

    .small-select {
      width: 90px;
      height: 24px;
      justify-content: start;
      padding-left: 10px;
      position: relative;
    }

    footer {
      height: 70px;
      display: flex;
      align-items: stretch;
      border-top: 1px solid rgba(60, 60, 65, 0.35);
      padding: 5px;
      gap: 0;
    }

    .file-buttons {
      width: 125px;
      display: grid;
      grid-template-rows: 1fr 1fr;
      gap: 4px;
      padding-right: 5px;
    }

    .wide-button {
      width: 118px;
      height: auto;
      font-size: 10px;
    }

    .pre-delay {
      width: 140px;
      display: grid;
      grid-template-columns: 70px 70px;
      align-items: center;
    }

    .footer-mini {
      display: grid;
      place-items: center;
    }

    .sync-stack {
      display: grid;
      grid-template-rows: 1fr 1fr;
      align-items: center;
      justify-items: center;
    }

    .width-block {
      width: 80px;
      display: grid;
      place-items: center;
    }

    .core-block {
      width: 100px;
      display: grid;
      place-items: center;
    }

    .io {
      margin-left: auto;
      width: 120px;
      display: grid;
      grid-template-rows: 1fr 1fr;
      padding: 5px 0;
    }

    .fader {
      display: grid;
      grid-template-columns: 30px 1fr;
      align-items: center;
      gap: 5px;
    }

    .fader-label {
      color: var(--text);
      font-size: 12px;
      text-align: right;
    }

    .track {
      height: 5px;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--accent) 0 62%, var(--line) 62% 100%);
      position: relative;
    }

    .track::after {
      content: "";
      width: 3px;
      height: 20px;
      border-radius: 2px;
      background: var(--text);
      position: absolute;
      left: 62%;
      top: -8px;
    }

    .active {
      background: var(--accent);
      color: #14120d;
      border-color: var(--accent);
    }
  </style>
</head>
<body>
  <section class="plugin" aria-label="Mockup atualizado da interface NIMBUS">
    <header>
      <div class="brand">
        <img class="logo" src="nimbus_logo_custom.svg" alt="">
        <div>
          <div class="brand-title">NIMBUS</div>
          <div class="brand-subtitle">Reverb</div>
        </div>
      </div>
      <div class="header-spacer"></div>
      <div class="select">Default</div>
      <div class="button">HQ</div>
    </header>

    <main>
      <section class="macro-row">
        <div class="macro">
          <div class="control-stack"><div class="label">Mix</div><div class="knob"></div></div>
        </div>
        <div class="macro">
          <div class="control-stack"><div class="label">Size</div><div class="knob"></div></div>
          <div class="toggle sync">Sync</div>
        </div>
        <div class="macro">
          <div class="control-stack"><div class="label">Feedback</div><div class="knob"></div></div>
        </div>
        <div class="macro">
          <div class="control-stack"><div class="label">Texture</div><div class="knob"></div></div>
        </div>
      </section>

      <section class="content">
        <div class="card left-card">
          <div class="card-title">grain / diffuser</div>
          <div class="mini-row">
            <div class="mini-control"><div class="label">Diffusion</div><div class="knob small"></div></div>
          </div>
          <div class="mini-row">
            <div class="mini-control"><div class="label">Grain Scan</div><div class="knob small"></div></div>
          </div>
          <div class="mini-row">
            <div class="mini-control"><div class="label">Rev Mix</div><div class="knob small"></div></div>
          </div>
          <div class="subgroup">
            <div class="subgroup-title">Freeze</div>
            <div class="toggle">Freeze</div>
            <div class="toggle">Hard Frz</div>
          </div>
        </div>

        <div></div>

        <div class="right-column">
          <div class="card right-card tone">
            <div class="card-title">tone / decay</div>
            <div class="right-card-row"><div class="mini-control"><div class="label">Damping</div><div class="knob small"></div></div></div>
            <div class="right-card-row"><div class="mini-control"><div class="label">Low Damp</div><div class="knob small"></div></div></div>
            <div class="right-card-row"><div class="mini-control"><div class="label">Tone</div><div class="knob small"></div></div></div>
          </div>
          <div></div>
          <div class="card right-card mod">
            <div class="card-title">modulation</div>
            <div class="right-card-row"><div class="mini-control"><div class="label">Depth</div><div class="knob small"></div></div></div>
            <div class="right-card-row"><div class="mini-control"><div class="label">Rate</div><div class="knob small"></div></div></div>
          </div>
          <div></div>
          <div class="card right-card shimmer">
            <div class="card-title">shimmer</div>
            <div class="right-card-row"><div class="mini-control"><div class="label">Shimmer</div><div class="knob small"></div></div></div>
            <div class="right-card-row"><div class="small-select">Octave</div></div>
          </div>
        </div>
      </section>
    </main>

    <footer>
      <div class="file-buttons">
        <div class="button wide-button">Load WASM JSON Preset...</div>
        <div class="button wide-button">Export to JSON...</div>
      </div>
      <div class="pre-delay">
        <div class="footer-mini"><div class="mini-control"><div class="label">PreDelay</div><div class="knob small"></div></div></div>
        <div class="sync-stack">
          <div class="toggle">Sync</div>
          <div class="small-select">1/4</div>
        </div>
      </div>
      <div class="width-block"><div class="mini-control"><div class="label">Width</div><div class="knob small"></div></div></div>
      <div class="core-block"><div class="toggle active">Stereo Core</div></div>
      <div class="io">
        <div class="fader"><div class="fader-label">In</div><div class="track"></div></div>
        <div class="fader"><div class="fader-label">Out</div><div class="track"></div></div>
      </div>
    </footer>
  </section>
</body>
</html>

name: Build VST Plugins

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # Permite rodar o build manualmente na aba Actions

jobs:
  wasm-smoke:
    name: WASM build smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
      - name: Build static and AudioWorklet modules
        working-directory: web_wasm
        run: |
          chmod +x build.sh build_live.sh
          ./build.sh
          ./build_live.sh
      - name: Verify generated modules and required C exports
        working-directory: web_wasm
        run: |
          test -s cloud_grey.js
          test -s cloud_grey_live.js
          grep -q 'cgv_set_preset' cloud_grey.js
          grep -q 'cgv_set_preset' cloud_grey_live.js

  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure CMake
        run: |
          cmake -B vst/build -S vst -DCMAKE_BUILD_TYPE=Release

      - name: Build Plugin
        run: |
          cmake --build vst/build --config Release --parallel 4

      - name: Run fast DSP regression tests
        run: |
          ctest --test-dir vst/build -C Release --output-on-failure

      - name: Upload VST3/Standalone Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NimbusReverb-Windows-Plugins
          path: |
            vst/build/**/*Nimbus*.vst3
            vst/build/**/*Nimbus*.exe

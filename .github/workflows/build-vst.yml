name: Build VST Plugins

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Permite rodar o build manualmente na aba Actions

jobs:
  dsp-safety:
    name: DSP circular safety and sanitizers
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [none, address-undefined]
    steps:
      - uses: actions/checkout@v4
      - name: Configure DSP tests
        shell: bash
        run: |
          flags=""
          if [ "${{ matrix.sanitizer }}" = address-undefined ]; then
            flags="-fsanitize=address,undefined -fno-omit-frame-pointer"
          fi
          cmake -S src/dsp -B build/dsp -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_CXX_FLAGS="$flags"
      - name: Build and test DSP
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          cmake --build build/dsp --parallel 4
          ctest --test-dir build/dsp --output-on-failure --parallel 2
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DSP-safety-${{ matrix.sanitizer }}
          path: |
            build/dsp/*.csv
            build/dsp/Testing/Temporary/LastTest.log
  wasm-smoke:
    name: WASM build smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
      - name: Build static and AudioWorklet modules
        working-directory: web_wasm
        run: |
          chmod +x build.sh build_live.sh
          ./build.sh
          ./build_live.sh
      - name: Verify generated modules and required C exports
        working-directory: web_wasm
        run: |
          test -s cloud_grey.js
          test -s cloud_grey_live.js
          grep -q 'cgv_set_preset' cloud_grey.js
          grep -q 'cgv_set_preset' cloud_grey_live.js

  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure CMake
        run: |
          cmake -B vst/build -S vst -DCMAKE_BUILD_TYPE=Release

      - name: Build Plugin
        run: |
          cmake --build vst/build --config Release --parallel 4

      - name: Run fast DSP regression tests
        run: |
          ctest --test-dir vst/build -C Release --output-on-failure

      - name: Upload VST3/Standalone Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NimbusReverb-Windows-Plugins
          path: |
            vst/build/**/*Nimbus*.vst3
            vst/build/**/*Nimbus*.exe
